<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GamepadDraw — Draw with a gamepad using brush sprites and symmetry patterns.">
  <title>GamepadDraw</title>

  <link rel="stylesheet" href="./style.css">

  <!--
    Load p5 and p5.joystick as globals BEFORE the ES module,
    so 'window.p5' is available when gamepadSketch.js runs.
  -->
  <script src="libs/p5.min.js"></script>
  <script src="libs/p5.joystick.min.js"></script>
</head>

<body>
  <!-- Loading screen (dismissed by p5 after preload completes) -->
  <div id="loading-screen">
    <div class="loading-title">GamepadDraw</div>
    <div class="loading-bar-wrap">
      <div class="loading-bar"></div>
    </div>
    <div class="loading-sub">Loading brush sprites…</div>
  </div>

  <!-- Gamepad connection indicator -->
  <div class="gamepad-indicator" id="gamepad-indicator">Gamepad connected</div>

  <!-- p5 sketch mounts here -->
  <div id="sketch-container"></div>

  <!--
    Bootstrap module — imports all core/ and ui/ modules.
    Must come AFTER p5 script tags.
  -->
  <script type="module" src="app.js"></script>

  <!-- Dismiss loading screen once p5 setup() has run -->
  <script type="module">
    // p5 dispatches no built-in ready event, so we poll the canvas briefly.
    const loading = document.getElementById('loading-screen');
    const indicator = document.getElementById('gamepad-indicator');

    const checkReady = setInterval(() => {
      if (document.querySelector('#sketch-container canvas')) {
        clearInterval(checkReady);
        loading.classList.add('done');
      }
    }, 200);

    // Gamepad connection indicator
    window.addEventListener('gamepadconnected', () => {
      indicator.classList.add('gamepad-indicator--active');
      setTimeout(() => indicator.classList.remove('gamepad-indicator--active'), 3000);
    });
    window.addEventListener('gamepaddisconnected', () => {
      indicator.style.color = '#ff2079';
      indicator.style.borderColor = 'rgba(255,32,121,0.4)';
      indicator.textContent = 'Gamepad disconnected';
      indicator.classList.add('gamepad-indicator--active');
      setTimeout(() => indicator.classList.remove('gamepad-indicator--active'), 2000);
    });
  </script>
</body>
</html>
